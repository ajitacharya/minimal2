<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Minimal Shop | Shopping Cart</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

    :root {
        --color-primary-dark: #1c1917;
        --color-secondary-light: #f5f5f4;
        --color-accent-gold: #ca8a04;
        --max-width: 1280px;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    html { font-family:'Inter',sans-serif; scroll-behavior: smooth; }
    body { background: linear-gradient(135deg,#f9fafb 0%,#e5e7eb 100%); color:var(--color-primary-dark); line-height:1.6; animation:fadeIn 1s ease-in-out; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 1rem; }
    a { text-decoration:none; color:inherit; }

    /* Header */
    .header { position:sticky; top:0; z-index:50; background-color: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);}
    .nav-content { display:flex; justify-content:space-between; align-items:center; padding:1rem 0; }
    .logo { font-size:1.875rem; font-weight:900; letter-spacing:-0.025em; }
    .nav-links { display:flex; gap:0.5rem; }
    .nav-links a { font-size:1.125rem; padding:0.5rem 0.75rem; border-radius:0.5rem; display:block; }

    /* Cart Section */
    .cart-section { padding:4rem 0 6rem; }
    .section-title { font-size:2.5rem; font-weight:700; text-align:center; margin-bottom:3rem; }

    .cart-layout {
        display:grid;
        gap: 2rem;
        grid-template-columns: 1fr;
        max-width: 1000px;
        margin: 0 auto;
    }

    .cart-items-container, .cart-summary-container {
        background:white;
        border-radius:0.75rem;
        padding:1.5rem;
        box-shadow:0 4px 6px rgba(0,0,0,0.1);
    }

    /* Cart Item */
    .cart-item {
        display:flex;
        align-items:center;
        padding:1rem 0;
        border-bottom:1px solid #e5e7eb;
    }
    .cart-item:last-child { border-bottom:none; }

    .item-image img {
        width:80px; 
        height:80px;
        border-radius:0.5rem;
        object-fit:contain;
        margin-right:1rem;
    }

    .item-quantity input {
        width:40px;
        text-align:center;
        border:1px solid #ccc;
        border-radius:5px;
        margin-left:5px;
    }

    .item-price-total {
        font-size:1.25rem;
        font-weight:700;
        margin-left:auto;
        color:var(--color-accent-gold);
    }

    /* Price highlight animation */
    .price-animate {
        animation: flash 0.4s ease;
    }
    @keyframes flash {
        0% { background: yellow; }
        100% { background: transparent; }
    }

    /* Summary */
    .summary-line {
        display:flex;
        justify-content:space-between;
        margin-bottom:0.75rem;
    }
    .summary-line.total {
        font-size:1.5rem;
        font-weight:700;
        padding-top:1rem;
        border-top:2px solid black;
    }

    .checkout-button {
        width:100%;
        background:black;
        color:white;
        padding:0.8rem;
        border-radius:0.5rem;
        margin-top:1rem;
        cursor:pointer;
    }

    @media(min-width:768px) {
        .cart-layout { grid-template-columns: 2fr 1fr; }
    }
</style>
</head>
<body>

<header class="header">
    <div class="container nav-content">
        <a href="index.html" class="logo">Minimal.</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="ourproducts.html">Our Products</a>
            <a href="aboutus.html">About Us</a>
            <a href="cart.html" class="cart-link active-link">🛒</a>
        </nav>
    </div>
</header>

<main>
<section class="cart-section">
    <div class="container">
        <h2 class="section-title">Your Shopping Cart</h2>

        <div class="cart-layout">
            <div class="cart-items-container"></div>

            <div class="cart-summary-container">
                <h3>Order Summary</h3>

                <div class="summary-line">
                    <span>Subtotal</span>
                    <span class="subtotal">$0.00</span>
                </div>

                <div class="summary-line">
                    <span>Shipping</span>
                    <span class="shipping">$0.00</span>
                </div>

                <div class="summary-line">
                    <span>Tax (8%)</span>
                    <span class="tax">$0.00</span>
                </div>

                <div class="summary-line total">
                    <span>Total</span>
                    <span class="total-price">$0.00</span>
                </div>

                <button class="checkout-button">Proceed to Checkout</button>

                <button id="clear-cart" style=" width:100%; background:#dc2626; color:white; padding:0.8rem; border-radius:0.5rem; margin-top:0.5rem; cursor:pointer;
">Clear Cart</button>
            </div>
        </div>
    </div>
</section>
</main>

<script>
const CART_KEY = "cart";
const itemsContainer = document.querySelector(".cart-items-container");

function loadCart() {
  const saved = localStorage.getItem(CART_KEY);
  return saved ? JSON.parse(saved) : [];
}
function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function animatePrice(el) {
  el.classList.remove("price-animate");
  void el.offsetWidth;
  el.classList.add("price-animate");
}

function renderCart() {
  const cart = loadCart();
  itemsContainer.innerHTML = "";

  if(cart.length === 0){
    itemsContainer.innerHTML = "<p>Your cart is empty.</p>";
    updateSummary();
    return;
  }

  cart.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <div class="item-image"><img src="${item.image}"></div>
      <div class="item-details">
        <h4>${item.name}</h4>
        <p>${item.details || ""}</p>
      </div>
      <div class="item-quantity">
        Qty: <input type="number" value="${item.quantity}" min="1" max="10" data-i="${index}">
      </div>
      <div class="item-price-total">$${(Number(item.price) * item.quantity).toFixed(2)}</div>
    `;

    itemsContainer.appendChild(div);
  });

  attachListeners();
  updateSummary();
}

function attachListeners(){
  document.querySelectorAll("input[type=number]").forEach(input => {
    input.addEventListener("change", () => {
      let cart = loadCart();
      let i = input.dataset.i;

      let qty = parseInt(input.value);
      if(qty < 1) qty = 1;

      cart[i].quantity = qty;
      saveCart(cart);
      renderCart();
    });
  });
  document.getElementById("clear-cart").addEventListener("click", () => {
    localStorage.removeItem(CART_KEY);
    renderCart();
});
}

function updateSummary(){
  const cart = loadCart();

  let subtotal = 0;
  cart.forEach(i => subtotal += Number(i.price) * i.quantity);

  let tax = subtotal * 0.08;
  let shipping = cart.length > 0 ? 10 : 0;
  let total = subtotal + tax + shipping;

  document.querySelector(".subtotal").textContent = `$${subtotal.toFixed(2)}`;
  document.querySelector(".shipping").textContent = `$${shipping.toFixed(2)}`;
  document.querySelector(".tax").textContent = `$${tax.toFixed(2)}`;
  document.querySelector(".total-price").textContent = `$${total.toFixed(2)}`;

  animatePrice(document.querySelector(".total-price")); // flash effect only
}

// Load cart initially
renderCart();
</script>

</body>
</html>
